# .github/workflows/docker.yml
#
# Fires when the `bundle` SUBMODULE POINTER is updated on main (i.e. a new
# bundle release has been pinned) or when this workflow file itself changes.
# The `bundle` path in the push filter refers to the gitlink entry in the
# superproject tree, not the branch — so this fires exactly when
# build-bundle.mjs has committed a new bundle and bumped the pointer.

name: Build and push image

on:
  push:
    branches: [main]
    paths:
      - bundle                          # submodule pointer changed → new release
      - .github/workflows/docker.yml    # workflow file itself changed
  workflow_dispatch:

permissions:
  contents: read
  packages: write     # needed to push to ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules (recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./bundle
          file: ./bundle/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
